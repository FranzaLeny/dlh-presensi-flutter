name: presensi_dlh
description: "Aplikasi Presensi Digital Dinas Lingkungan Hidup"
publish_to: 'none'
version: 0.0.1-beta.3+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^17.3.0

  # State Management
  flutter_riverpod: ^3.3.2

  # HTTP
  dio: ^5.8.0

  # Database Lokal
  sqflite: ^2.4.2
  path: ^1.9.1

  # Secure Storage
  flutter_secure_storage: ^10.3.1

  # Lokasi & Permission
  geolocator: ^14.0.3
  permission_handler: ^12.0.3

  # Kamera
  camera: ^0.12.0+1

  # File System
  path_provider: ^2.1.6

  # Konektivitas
  connectivity_plus: ^7.2.0

  # Kriptografi RSA
  pointycastle: ^4.0.0
  asn1lib: ^1.5.8

  # Device Info
  device_info_plus: ^13.2.0

  # Date Formatting
  intl: ^0.20.2
  google_mlkit_face_detection: ^0.13.2
  flutter_svg: ^2.0.10+1
  file_picker: 12.0.0-beta.7
  image_picker: ^1.2.3
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/launcher-icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/launcher-icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

  fonts:
    - family: Digital7
      fonts:
        - asset: assets/fonts/Digital7Mono.ttf
