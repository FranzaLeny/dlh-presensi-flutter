name: Flutter Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      commit_hash: ${{ steps.commit.outputs.hash }}
      commit_short_msg: ${{ steps.commit.outputs.short_message }}
      commit_full_msg: ${{ steps.commit.outputs.full_message }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract Version
        id: version
        run: |
          FULL_VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          BASE_VERSION=$(echo $FULL_VERSION | cut -d '+' -f 1)
          echo "APP_VERSION=$BASE_VERSION" >> $GITHUB_ENV
          echo "app_version=$BASE_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/upload-keystore.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build APK (Split per ABI)
        env:
          API_URL: ${{ secrets.API_URL }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
        run: |
          API_URL_CLEAN=$(echo "$API_URL" | tr -d '\n' | tr -d '\r')
          BETTER_AUTH_URL_CLEAN=$(echo "$BETTER_AUTH_URL" | tr -d '\n' | tr -d '\r')
          flutter build apk --release --split-per-abi --build-number="${{ github.run_number }}" --dart-define="API_URL=$API_URL_CLEAN" --dart-define="BETTER_AUTH_URL=$BETTER_AUTH_URL_CLEAN"

      - name: Ubah Nama File APK
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/DigiLH-android-new-arm64-v${{ env.APP_VERSION }}.${{ github.run_number }}.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/DigiLH-android-old-arm32-v${{ env.APP_VERSION }}.${{ github.run_number }}.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/DigiLH-x86-v${{ env.APP_VERSION }}.${{ github.run_number }}.apk

      - name: Ambil pesan commit
        id: commit
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

          SHORT_MSG=$(git log -1 --pretty=%s | cut -c1-80)
          echo "short_message=$SHORT_MSG" >> $GITHUB_OUTPUT

          echo "full_message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Simpan Artifact APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: build/app/outputs/flutter-apk/*.apk

  publish-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Unduh Artifact APK
        uses: actions/download-artifact@v4
        with:
          name: apk-artifacts
          path: apks

      - name: Publish ke Halaman Utama GitHub (Release)
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ needs.build.outputs.app_version }}.${{ github.run_number }}"
          name: "v${{ needs.build.outputs.app_version }}.${{ github.run_number }} - ${{ needs.build.outputs.commit_short_msg }}"
          prerelease: true
          allowUpdates: true
          body: |
            📱 **DigiLH Android Release**

            **Versi:** `${{ needs.build.outputs.app_version }}`
            **Build:** `${{ github.run_number }}`
            **Commit:** `${{ needs.build.outputs.commit_hash }}`

            ### ✨ Perubahan
            ${{ needs.build.outputs.commit_full_msg }}

            ### 📦 File APK
            - **ARM64** → Android 64-bit (disarankan)
            - **ARM32** → Android lama
            - **x86_64** → Emulator

            > Jika mengalami konflik saat instal, pastikan APK ini ditandatangani dengan keystore yang sama seperti versi sebelumnya.

          artifacts: "apks/*.apk"

  upload-gdrive:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Unduh Artifact APK
        uses: actions/download-artifact@v4
        with:
          name: apk-artifacts
          path: apks

      - name: Upload APK ke Google Drive (OAuth2 Rclone)
        uses: rclone/rclone-action@v1
        with:
          args: copy apks/ gdrive: --drive-root-folder-id=1C1JlytzFO1GdVkcjUsRP4MO92x_EclEU
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
