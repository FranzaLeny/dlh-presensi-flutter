name: Flutter Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract Version
        run: |
          FULL_VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          BASE_VERSION=$(echo $FULL_VERSION | cut -d '+' -f 1)
          echo "APP_VERSION=$BASE_VERSION" >> $GITHUB_ENV

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/upload-keystore.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build APK (Split per ABI)
        env:
          API_URL: ${{ secrets.API_URL }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
        run: |
          API_URL_CLEAN=$(echo "$API_URL" | tr -d '\n' | tr -d '\r')
          BETTER_AUTH_URL_CLEAN=$(echo "$BETTER_AUTH_URL" | tr -d '\n' | tr -d '\r')
          flutter build apk --release --split-per-abi --build-number="${{ github.run_number }}" --dart-define="API_URL=$API_URL_CLEAN" --dart-define="BETTER_AUTH_URL=$BETTER_AUTH_URL_CLEAN"

      - name: Ubah Nama File APK
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/DigiLH-android-new-arm64-v${{ env.APP_VERSION }}.${{ github.run_number }}.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/DigiLH-android-old-arm32-v${{ env.APP_VERSION }}.${{ github.run_number }}.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/DigiLH-x86-v${{ env.APP_VERSION }}.${{ github.run_number }}.apk

      - name: Ambil pesan commit
        id: commit
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

          SHORT_MSG=$(git log -1 --pretty=%s | cut -c1-80)
          echo "short_message=$SHORT_MSG" >> $GITHUB_OUTPUT

          echo "full_message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish ke Halaman Utama GitHub (Release)
        uses: ncipollo/release-action@v1
        if: github.event_name != 'pull_request'
        with:
          tag: "v${{ env.APP_VERSION }}.${{ github.run_number }}"
          name: "v${{ env.APP_VERSION }}.${{ github.run_number }} - ${{ steps.commit.outputs.short_message }}"
          prerelease: true
          allowUpdates: true
          body: |
            📱 **DigiLH Android Release**

            **Versi:** `${{ env.APP_VERSION }}`
            **Build:** `${{ github.run_number }}`
            **Commit:** `${{ steps.commit.outputs.hash }}`

            ### ✨ Perubahan
            ${{ steps.commit.outputs.full_message }}

            ### 📦 File APK
            - **ARM64** → Android 64-bit (disarankan)
            - **ARM32** → Android lama
            - **x86_64** → Emulator

            > Jika mengalami konflik saat instal, pastikan APK ini ditandatangani dengan keystore yang sama seperti versi sebelumnya.

          artifacts: "build/app/outputs/flutter-apk/*.apk"

      - name: Upload APK ke Google Drive (ARM64)
        uses: adityak74/google-drive-upload-git-action@v0.1
        if: github.event_name != 'pull_request'
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "build/app/outputs/flutter-apk/DigiLH-android-new-arm64-v${{ env.APP_VERSION }}.${{ github.run_number }}.apk"
          folderId: "1C1JlytzFO1GdVkcjUsRP4MO92x_EclEU"
          overwrite: "true"

      - name: Upload APK ke Google Drive (ARM32)
        uses: adityak74/google-drive-upload-git-action@v0.1
        if: github.event_name != 'pull_request'
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "build/app/outputs/flutter-apk/DigiLH-android-old-arm32-v${{ env.APP_VERSION }}.${{ github.run_number }}.apk"
          folderId: "1C1JlytzFO1GdVkcjUsRP4MO92x_EclEU"
          overwrite: "true"

      - name: Upload APK ke Google Drive (x86_64)
        uses: adityak74/google-drive-upload-git-action@v0.1
        if: github.event_name != 'pull_request'
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "build/app/outputs/flutter-apk/DigiLH-x86-v${{ env.APP_VERSION }}.${{ github.run_number }}.apk"
          folderId: "1C1JlytzFO1GdVkcjUsRP4MO92x_EclEU"
          overwrite: "true"
