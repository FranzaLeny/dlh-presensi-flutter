name: Flutter Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan build manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64-v8a APK (HP Baru 64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-(HP-Baru)
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      - name: Upload armeabi-v7a APK (HP Lama 32-bit)
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release-(HP-Lama)
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 7

      - name: Upload x86_64 APK (Emulator/PC)
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release-(Emulator)
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7
